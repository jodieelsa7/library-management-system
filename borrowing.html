<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My loans · Digital E-Library</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <main class="page">
    <header class="app-bar">
      <h1 class="app-bar__title">My loans</h1>
    </header>

    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-tab="active">On loan</button>
      <button type="button" class="tab" data-tab="history">History</button>
      <button type="button" class="tab hidden" data-tab="all">All loans</button>
    </div>

    <div class="stack" id="loan-list"></div>
  </main>

  <div id="nav-placeholder"></div>

  <script type="module" src="nav.js"></script>
  <script type="module" src="borrowing.js"></script>
</body>
</html>
