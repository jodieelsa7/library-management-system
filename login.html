<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Digital E-Library</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="no-nav">
  <main class="auth-wrap">
    <div class="auth-card hidden" id="auth-card">
      <div class="auth-card__brand">
        <h1>Digital E-Library</h1>
        <p>Sign in to browse and borrow</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-error hidden" id="form-error" role="alert"></div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
